[project]
name = "quality-reviewer-lite"
version = "0.1.0"
description = "一个只做电脑助手的极简飞书机器人"
requires-python = ">=3.12"
dependencies = [
    "langchain-openai==1.6.0",
    "lark-oapi==1.7.3",
    "deepagents==0.7.13",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
